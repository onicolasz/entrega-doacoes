name: Validate mobile and API
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Configure local test services
        run: |
          cp .env.example .env
          cp apps/mobile/.env.example apps/mobile/.env
          docker compose up -d --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @entrega/mobile exec expo-doctor
      - run: pnpm --filter @entrega/mobile export:web
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Stop services
        if: always()
        run: docker compose down
